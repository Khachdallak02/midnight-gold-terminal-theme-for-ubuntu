"$schema" = 'https://starship.rs/config-schema.json'

# Yellow-text theme: dark blocks, golden text

format = """
[](seg1)\
$os\
$username\
[](bg:seg2 fg:seg1)\
$directory\
[](fg:seg2 bg:seg3)\
$git_branch\
$git_status\
[](fg:seg3 bg:seg4)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$java\
$python\
[](fg:seg4 bg:seg5)\
$docker_context\
$conda\
[](fg:seg5 bg:seg6)\
$time\
[ ](fg:seg6)\
$line_break$character"""

palette = 'yellow_text'

[palettes.yellow_text]
text = '#fabd2f'         # main yellow text
text_bright = '#ffd75f'  # brighter yellow for the folder name
text_soft = '#d8a657'    # softer gold for less important info
seg1 = '#1d2021'         # block backgrounds, dark to lighter
seg2 = '#282828'
seg3 = '#32302f'
seg4 = '#3c3836'
seg5 = '#45403d'
seg6 = '#504945'
green = '#b8bb26'
red = '#fb4934'
purple = '#d3869b'

[os]
disabled = false
style = "bg:seg1 fg:text"

[os.symbols]
Ubuntu = "󰕈 "
Linux = "󰌽 "

[username]
show_always = true
style_user = "bg:seg1 fg:text"
style_root = "bg:seg1 fg:red"
format = '[$user ]($style)'

[directory]
style = "bold fg:text_bright bg:seg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:seg3"
format = '[[ $symbol $branch ](fg:text bg:seg3)]($style)'

[git_status]
style = "bg:seg3"
format = '[[($all_status$ahead_behind )](fg:text bg:seg3)]($style)'

[c]
symbol = " "
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[cpp]
symbol = " "
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[rust]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[golang]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[nodejs]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[java]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[python]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_soft bg:seg4)]($style)'

[docker_context]
symbol = ""
style = "bg:seg5"
format = '[[ $symbol( $context) ](fg:text_soft bg:seg5)]($style)'

[conda]
style = "bg:seg5"
format = '[[ $symbol( $environment) ](fg:text_soft bg:seg5)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:seg6"
format = '[[  $time ](fg:text bg:seg6)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:text)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
